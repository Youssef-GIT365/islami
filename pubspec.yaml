name: islami
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  flutter_native_splash: ^2.4.7
  smooth_page_indicator: ^2.0.1
  flutter_launcher_icons: ^0.14.4
  dio: ^5.9.2
  dartz: ^0.10.1
  equatable: ^2.0.8
  flutter_bloc: ^9.1.1
  audioplayers: ^6.7.1
  get_it: ^9.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  flutter_gen_runner: ^5.0.0

flutter_gen:
  output: lib/core/gen/
  integrations:
    image: true
    flutter_svg: true
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/ic_splash.png"
  min_sdk_android: 21
adaptive_icon_background: "#202020"
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/suras/
  fonts:
    - family: jana
      fonts:
        - asset: assets/fonts/ArbFONTS-Janna-LT-Regular.ttf
    - family: kamali
      fonts:
        - asset: assets/fonts/Kamali.otf
flutter_native_splash:
  color: "#202020"
  image: assets/icons/ic_splash.png
  fullscreen: true

  android_gravity: fill
  android_12:
    image: assets/icons/ic_splash.png
    color: "#202020"
